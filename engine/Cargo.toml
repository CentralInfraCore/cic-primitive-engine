[package]
name = "cic-primitive-engine"
description = "Turns a CIC composition into validated, materialized PrimitiveIR."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The event scanner is used to refuse aliases BEFORE a tree is composed, so a
# 393-byte input cannot expand into millions of nodes. It is saphyr's own
# parser, so this pins no second YAML implementation.
saphyr = "0.0.6"
saphyr-parser = "0.0.6"
# A7's digest (sha256: + lowercase-hex) -- the RustCrypto implementation,
# not a hand-rolled one: a cryptographic primitive is exactly the case where
# reusing an audited, widely-depended-on crate is the right call, unlike the
# canonicalization logic itself (section A), which is ported by hand so this
# crate stays self-contained.
sha2 = "0.10"
# The numeric comparator (F, conformance.rs) needs exact rational equality
# across int/big-int/float/numeric-string, mirroring Go's own compare.go,
# which uses math/big.Rat for exactly this reason (float64 would silently
# reintroduce the precision loss section A's own number handling exists to
# avoid). Arbitrary-precision rational arithmetic is a well-defined math
# primitive, same case as sha2 above -- reuse an audited crate, don't
# hand-roll bignum division.
num-bigint = "0.4"
num-rational = "0.4"
num-traits = "0.2"
